<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Arial, Helvetica, sans-serif"><rect width="680" height="300" fill="#fff"/><text x="340" y="24" font-size="15" font-weight="bold" text-anchor="middle">Which jumper joins server and PDU</text><rect x="20" y="50" width="170" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="105.0" y="74.0" font-size="15" font-weight="bold" text-anchor="middle">C14 inlet</text><text x="105.0" y="93.0" font-size="12" text-anchor="middle" fill="#444">most 1U/2U PSUs</text><line x1="190" y1="78" x2="462" y2="78" stroke="#00e" stroke-width="3"/><path d="M460,72 L470,78 L460,84 Z" fill="#00e"/><text x="330.0" y="68" font-size="12" text-anchor="middle" fill="#00e">C13–C14 jumper</text><rect x="470" y="50" width="190" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="565.0" y="74.0" font-size="15" font-weight="bold" text-anchor="middle">C13 outlet</text><text x="565.0" y="93.0" font-size="12" text-anchor="middle" fill="#444">most PDU outlets</text><rect x="20" y="128" width="170" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="105.0" y="152.0" font-size="15" font-weight="bold" text-anchor="middle">C20 inlet</text><text x="105.0" y="171.0" font-size="12" text-anchor="middle" fill="#444">~2000 W+ PSUs</text><line x1="190" y1="156" x2="462" y2="156" stroke="#00e" stroke-width="3"/><path d="M460,150 L470,156 L460,162 Z" fill="#00e"/><text x="330.0" y="146" font-size="12" text-anchor="middle" fill="#00e">C19–C20 jumper</text><rect x="470" y="128" width="190" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="565.0" y="152.0" font-size="15" font-weight="bold" text-anchor="middle">C19 outlet</text><text x="565.0" y="171.0" font-size="12" text-anchor="middle" fill="#444">3–6 per PDU</text><rect x="20" y="206" width="170" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="105.0" y="230.0" font-size="15" font-weight="bold" text-anchor="middle">C14 inlet</text><text x="105.0" y="249.0" font-size="12" text-anchor="middle" fill="#444">PSU up to ~1600 W</text><line x1="190" y1="234" x2="462" y2="234" stroke="#00e" stroke-width="3"/><path d="M460,228 L470,234 L460,240 Z" fill="#00e"/><text x="330.0" y="224" font-size="12" text-anchor="middle" fill="#00e">C13–C20 jumper (10 A)</text><rect x="470" y="206" width="190" height="56" rx="8" fill="#f2f4f7" stroke="#222" stroke-width="2"/><text x="565.0" y="230.0" font-size="15" font-weight="bold" text-anchor="middle">C19 outlet</text><text x="565.0" y="249.0" font-size="12" text-anchor="middle" fill="#444">when C13s are full</text><text x="340" y="292" font-size="11" text-anchor="middle" fill="#888">C20 inlet + C13-only PDU = no safe standard cord. rackmatch.net</text></svg>