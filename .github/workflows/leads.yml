name: leads
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      picks:
        description: "1 = only fetch comments for leads/picks.txt"
        default: "0"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leads
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src
      - run: python3 src/scripts/leads.py
        env:
          PICKS: ${{ github.event.inputs.picks }}
      - run: |
          git config user.name "rackmatch-leads"
          git config user.email "leads@rackmatch.net"
          git add leads/
          git commit -m "Update leads" || echo "no changes"
          git push
